name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes (e.g. fetch-data) do not trigger push workflows
  workflow_run:
    workflows: [Fetch Market Data]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve code build timestamp
        id: build-timestamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          to_unix_seconds() {
            node -e 'const value = Date.parse(process.argv[1]); if (!Number.isFinite(value)) process.exit(1); process.stdout.write(String(Math.floor(value / 1000)))' "$1"
          }

          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            current_run_created_at="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --jq '.created_at'
            )"
            build_timestamp="$(to_unix_seconds "$current_run_created_at")"
            echo "value=$build_timestamp" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A market-data refresh redeploys the existing app. Reuse the most
          # recent code deployment's timestamp instead of counting it as a new
          # app build.
          latest_push="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].created_at // ""'
          )"
          latest_dispatch="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=workflow_dispatch \
              -f status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].created_at // ""'
          )"

          build_created_at="$latest_push"
          if [[ "$latest_dispatch" > "$build_created_at" ]]; then
            build_created_at="$latest_dispatch"
          fi
          if [[ -z "$build_created_at" ]]; then
            echo "No successful code deployment was found." >&2
            exit 1
          fi

          build_timestamp="$(to_unix_seconds "$build_created_at")"
          echo "value=$build_timestamp" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BUILD_NUMBER: ${{ steps.build-timestamp.outputs.value }}
          VITE_BACKEND_API_URL: https://market-dashboard-api.florian-trippel.workers.dev
          VITE_FIREBASE_API_KEY: AIzaSyBY8nKYYGMcxxmhLpFF1V-LMFQiBgrTYns
          VITE_FIREBASE_AUTH_DOMAIN: market-dashboard-f832e.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: market-dashboard-f832e
          VITE_FIREBASE_STORAGE_BUCKET: market-dashboard-f832e.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "923810954895"
          VITE_FIREBASE_APP_ID: 1:923810954895:web:7588911a204b75f407fafa
        run: npm run build

      - name: Verify dist output
        run: node scripts/verify-dist.mjs

      - name: List dist files
        run: find dist -type f | sort

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: 'deploy: ${{ github.sha }}'
