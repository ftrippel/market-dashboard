name: Deploy Frontend and Worker

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes (e.g. fetch-data) do not trigger push workflows
  workflow_run:
    workflows: [Fetch Market Data]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_LIVE_DATA_REFRESH_MS: ${{ vars.VITE_LIVE_DATA_REFRESH_MS }}
      VITE_LIVE_DATA_IDLE_RETRY_MS: ${{ vars.VITE_LIVE_DATA_IDLE_RETRY_MS }}
      VITE_ENABLE_BUILD_VERSION_CHECK: ${{ vars.VITE_ENABLE_BUILD_VERSION_CHECK }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment configuration
        run: |
          required_variables=(
            ALLOWED_ORIGINS
          )
          firebase_variables=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )
          missing_variables=()
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              missing_variables+=("$variable_name")
            fi
          done
          configured_firebase_variables=0
          for variable_name in "${firebase_variables[@]}"; do
            if [[ -n "${!variable_name}" ]]; then
              ((configured_firebase_variables += 1))
            fi
          done
          if (( configured_firebase_variables > 0 && configured_firebase_variables < ${#firebase_variables[@]} )); then
            for variable_name in "${firebase_variables[@]}"; do
              if [[ -z "${!variable_name}" ]]; then
                missing_variables+=("$variable_name")
              fi
            done
          fi
          if (( ${#missing_variables[@]} > 0 )); then
            echo "Missing GitHub repository variables: ${missing_variables[*]}" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Resolve code build timestamp
        id: build-timestamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          to_unix_seconds() {
            node -e 'const value = Date.parse(process.argv[1]); if (!Number.isFinite(value)) process.exit(1); process.stdout.write(String(Math.floor(value / 1000)))' "$1"
          }

          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            current_run_created_at="$(
              gh api --method GET \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --jq '.created_at'
            )"
            build_timestamp="$(to_unix_seconds "$current_run_created_at")"
            echo "value=$build_timestamp" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A market-data refresh redeploys the existing app. Reuse the most
          # recent code deployment's timestamp instead of counting it as a new
          # app build.
          latest_push="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=push \
              -f status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].created_at // ""'
          )"
          latest_dispatch="$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs" \
              -f branch=main \
              -f event=workflow_dispatch \
              -f status=success \
              -F per_page=1 \
              --jq '.workflow_runs[0].created_at // ""'
          )"

          build_created_at="$latest_push"
          if [[ "$latest_dispatch" > "$build_created_at" ]]; then
            build_created_at="$latest_dispatch"
          fi
          if [[ -z "$build_created_at" ]]; then
            echo "No successful code deployment was found." >&2
            exit 1
          fi

          build_timestamp="$(to_unix_seconds "$build_created_at")"
          echo "value=$build_timestamp" >> "$GITHUB_OUTPUT"

      - name: Build for Cloudflare
        env:
          VITE_BUILD_NUMBER: ${{ steps.build-timestamp.outputs.value }}
        run: npm run build:cloudflare

      - name: Verify Cloudflare output
        run: node scripts/verify-dist.mjs

      - name: Deploy frontend and API to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var "ALLOWED_ORIGINS:${{ vars.ALLOWED_ORIGINS }}"
